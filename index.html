<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>I WAS HERE</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root{
  --bg:#0a0a0a;
  --land:#191919;
  --land-hover:#242424;
  --border:rgba(255,255,255,0.10);
  --border-strong:rgba(255,255,255,0.24);
  --text-dim:rgba(255,255,255,0.32);
  --text-mid:rgba(255,255,255,0.55);
  --text-bright:rgba(255,255,255,0.90);
  --accent:#E8A33D;
  --accent-dim:rgba(232,163,61,0.20);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;width:100%;height:100%;background:var(--bg);color:var(--text-bright);
  font-family:'IBM Plex Mono',monospace;overflow:hidden;-webkit-tap-highlight-color:transparent;}
#app{position:relative;width:100vw;height:100vh;}
svg#map{width:100%;height:100%;display:block;background:var(--bg);cursor:grab;touch-action:none;}
svg#map:active{cursor:grabbing;}

.topbar{position:absolute;top:0;left:0;right:0;z-index:10;display:flex;align-items:flex-start;
  justify-content:space-between;gap:12px;padding:18px 18px 0;pointer-events:none;flex-wrap:wrap;}
.brand{pointer-events:auto;}
.brand h1{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14px;letter-spacing:0.03em;
  margin:0;color:var(--text-bright);}
.brand p{margin:3px 0 0;font-size:10.5px;color:var(--text-dim);}

.search-wrap{pointer-events:auto;position:relative;width:min(320px,60vw);}
.search-input{width:100%;background:rgba(255,255,255,0.05);border:1px solid var(--border);
  color:var(--text-bright);padding:9px 12px;font-family:'IBM Plex Mono',monospace;font-size:12.5px;
  border-radius:2px;outline:none;transition:border-color .15s,background .15s;}
.search-input:focus{border-color:var(--accent);background:rgba(255,255,255,0.08);}
.search-input::placeholder{color:var(--text-dim);}

.suggestions{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#141414;
  border:1px solid var(--border);border-radius:2px;overflow-y:auto;max-height:min(260px,50vh);
  box-shadow:0 8px 24px rgba(0,0,0,0.4);}
.suggestion{padding:9px 12px;font-size:12px;color:var(--text-mid);cursor:pointer;
  border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:1px;}
.suggestion:last-child{border-bottom:none;}
.suggestion:hover,.suggestion.active{background:rgba(255,255,255,0.06);color:var(--text-bright);}
.suggestion .s-name{color:inherit;}
.suggestion .s-meta{color:var(--text-dim);font-size:10px;}
.suggestion.empty{color:var(--text-dim);cursor:default;}
.suggestion.empty:hover{background:none;}

.zoom-controls{position:absolute;right:16px;bottom:74px;z-index:10;display:flex;flex-direction:column;}
.zoom-btn{width:30px;height:30px;background:rgba(255,255,255,0.05);border:1px solid var(--border);
  color:var(--text-bright);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-family:'IBM Plex Mono',monospace;line-height:1;}
.zoom-btn:hover{background:rgba(255,255,255,0.12);}
.zoom-btn:not(:last-child){border-bottom:none;}

.footer-bar{position:absolute;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:space-between;
  align-items:flex-end;gap:10px;padding:12px 16px;pointer-events:none;}
.counter{font-size:10.5px;color:var(--text-dim);letter-spacing:0.02em;}
.counter b{color:var(--accent);font-weight:500;}
.attribution{font-size:9px;color:rgba(255,255,255,0.16);text-align:right;line-height:1.5;}

.popup{position:fixed;z-index:30;background:#141414;border:1px solid var(--border-strong);
  padding:10px 12px;border-radius:2px;font-size:12px;min-width:150px;max-width:220px;
  transform:translate(-50%,calc(-100% - 14px));pointer-events:auto;box-shadow:0 8px 24px rgba(0,0,0,0.5);}
.popup .p-name{color:var(--text-bright);font-family:'Space Grotesk',sans-serif;font-size:13px;margin-bottom:2px;}
.popup .p-meta{color:var(--text-dim);font-size:10px;margin-bottom:9px;}
.popup .p-actions{display:flex;gap:6px;}
.popup button{flex:1;background:transparent;border:1px solid var(--border);color:var(--text-mid);
  font-family:'IBM Plex Mono',monospace;font-size:10.5px;padding:6px 4px;cursor:pointer;border-radius:1px;}
.popup button.validate{border-color:var(--accent);color:var(--accent);}
.popup button.validate:hover{background:var(--accent-dim);}
.popup button.delete:hover{background:rgba(255,90,90,0.12);border-color:rgba(255,90,90,0.45);color:#ff9c9c;}

.status-msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:var(--text-dim);font-size:12px;letter-spacing:0.04em;z-index:40;text-align:center;padding:20px;}

/* map layers */
.country{fill:var(--land);stroke:var(--border);stroke-width:0.6;vector-effect:non-scaling-stroke;transition:fill .15s;}
.country:hover{fill:var(--land-hover);}
.country-label{fill:var(--text-dim);font-family:'IBM Plex Mono',monospace;text-anchor:middle;
  pointer-events:none;user-select:none;dominant-baseline:middle;}

.place-marker{cursor:pointer;}
.city-dot-pulse{fill:none;stroke:var(--accent);stroke-width:1.3;opacity:0.65;transform-box:fill-box;
  transform-origin:center;animation:pulse-ring 2.6s ease-out infinite;}
.city-dot-outer{fill:var(--accent);opacity:0.16;}
.city-dot-inner{fill:var(--accent);}
.city-label{fill:var(--text-bright);font-family:'Space Grotesk',sans-serif;font-size:9.5px;font-weight:500;
  pointer-events:none;user-select:none;}
.draft .city-dot-pulse{display:none;}
.draft .city-dot-outer{display:none;}
.draft .city-dot-inner{fill:transparent;stroke:var(--accent);stroke-width:1.2;stroke-dasharray:1.5,1.5;}
.draft .city-label{fill:var(--text-mid);font-style:italic;}
.sync-error .city-dot-pulse{stroke:#ff6b6b;}
.sync-error .city-dot-outer{fill:#ff6b6b;opacity:0.18;}
.sync-error .city-dot-inner{fill:#ff6b6b;}
.sync-error .city-label{fill:#ff9c9c;}

@keyframes pulse-ring{0%{transform:scale(0.5);opacity:0.75;}100%{transform:scale(2.4);opacity:0;}}
@keyframes label-in{from{opacity:0;transform:translateY(3px);}to{opacity:1;transform:translateY(0);}}
.city-label.is-new{animation:label-in .5s ease-out;}

@media (prefers-reduced-motion:reduce){
  .city-dot-pulse{animation:none;}
  .city-label.is-new{animation:none;}
}
</style>
</head>

function showDebug(msg){
  const el = document.getElementById('debugBanner');
  if(!el) return;
  const text = (msg && msg.message) ? msg.message : String(msg);
  el.textContent = 'Erreur : ' + text;
  el.style.display = 'block';
}
window.addEventListener('error', (e)=> showDebug(e.message + ' (ligne ' + e.lineno + ')'));
window.addEventListener('unhandledrejection', (e)=> showDebug((e.reason && e.reason.message) || e.reason));

(async function(){
  const W = 980, H = 560;
  const MIN_LABEL_K = 1.9;
  const LABEL_AREA_FACTOR = 2400;
  const CITY_LABEL_MIN_K = 2.3; // les noms de villes n'apparaissent qu'à partir de ce zoom (le point reste toujours visible)

  const svg = d3.select('#map').attr('viewBox', `0 0 ${W} ${H}`).attr('preserveAspectRatio','xMidYMid meet');
  const statusMsg = document.getElementById('statusMsg');
  const counterEl = document.getElementById('counter');

  const COUNTRIES_URL = 'https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_admin_0_countries.geojson';

  let countries;
  try{
    countries = await fetch(COUNTRIES_URL).then(r=>{ if(!r.ok) throw new Error('countries'); return r.json(); });
  }catch(e){
    statusMsg.textContent = "Impossible de charger les données cartographiques. Vérifiez la connexion et rechargez.";
    return;
  }

  statusMsg.style.display = 'none';
  svg.style('display','block');

  // ---- projection ----
  const projection = d3.geoNaturalEarth1();
  projection.fitExtent([[18,18],[W-18,H-18]], countries);
  const path = d3.geoPath(projection);

  function bestPolygonCentroid(feature){
    if(feature.geometry.type === 'Polygon') return path.centroid(feature);
    let maxArea = -1, best = null;
    feature.geometry.coordinates.forEach(coords=>{
      const poly = { type:'Polygon', coordinates: coords };
      const a = Math.abs(d3.geoArea(poly));
      if(a > maxArea){ maxArea = a; best = poly; }
    });
    return best ? path.centroid(best) : path.centroid(feature);
  }

  // ---- svg structure ----
  const bg = svg.append('rect').attr('class','bg-catcher').attr('width', W).attr('height', H).attr('fill','transparent');
  const g = svg.append('g').attr('class','zoom-layer');
  const gCountries = g.append('g').attr('class','countries-layer');
  const gCities = g.append('g').attr('class','cities-layer');

  // ---- countries + labels ----
  const countryData = countries.features.map(f=>{
    const c = bestPolygonCentroid(f);
    const area = path.area(f);
    return { feature:f, centroid:c, area, name: f.properties.NAME_FR || f.properties.NAME };
  }).filter(d=> d.centroid && !isNaN(d.centroid[0]) && !isNaN(d.centroid[1]));

  gCountries.selectAll('path.country')
    .data(countries.features)
    .join('path')
      .attr('class','country')
      .attr('d', path);

  const countryLabelAnchors = gCountries.selectAll('g.country-label-anchor')
    .data(countryData)
    .join('g')
      .attr('class','country-label-anchor')
      .attr('transform', d=>`translate(${d.centroid[0]},${d.centroid[1]})`)
      .style('display','none');
  const countryLabelInner = countryLabelAnchors.append('g').attr('class','inner-scale');
  countryLabelInner.append('text')
    .attr('class','country-label')
    .style('font-size','9px')
    .text(d=>d.name);

  // ---- popup ----
  const popupEl = document.createElement('div');
  popupEl.className = 'popup';
  popupEl.style.display = 'none';
  document.getElementById('app').appendChild(popupEl);

  function cityScreenPos(cx, cy){
    const rect = svg.node().getBoundingClientRect();
    const t = d3.zoomTransform(svg.node());
    const vx = t.applyX(cx), vy = t.applyY(cy);
    const scaleX = rect.width / W, scaleY = rect.height / H;
    return { x: rect.left + vx * scaleX, y: rect.top + vy * scaleY };
  }

  function openPopup(d){
    const pos = cityScreenPos(d.x, d.y);
    popupEl.style.left = pos.x + 'px';
    popupEl.style.top = pos.y + 'px';
    const canValidate = d.status === 'draft' || d.status === 'saving';
    const isError = d.status === 'sync-error';
    popupEl.innerHTML = `
      <div class="p-name">${escapeHtml(d.name)}</div>
      <div class="p-meta">${escapeHtml(d.meta || '')}</div>
      ${isError ? '<div class="p-meta" style="color:#ff9c9c">Sauvegarde échouée — vérifie ta connexion</div>' : ''}
      <div class="p-actions">
        ${canValidate ? '<button class="validate" data-act="validate">Valider</button>' : ''}
        ${isError ? '<button class="validate" data-act="retry">Réessayer</button>' : ''}
        <button class="delete" data-act="delete">${canValidate ? 'Annuler' : 'Supprimer'}</button>
      </div>`;
    popupEl.style.display = 'block';
    popupEl.querySelectorAll('button').forEach(btn=>{
      btn.addEventListener('click', (ev)=>{
        ev.stopPropagation();
        try{
          if(btn.dataset.act === 'validate' || btn.dataset.act === 'retry') validateCity(d.id);
          if(btn.dataset.act === 'delete') deleteCity(d.id);
        }catch(err){ showDebug(err); }
      });
    });
  }
  function closePopup(){ popupEl.style.display = 'none'; }

  async function validateCity(id){
    const c = cities.find(c=>c.id===id);
    if(!c) return;
    c.status = 'saving';
    renderCities(id);
    updateCounter();
    closePopup();
    try{
      const { error } = await sb.from('visited_places')
        .insert([{ id:c.id, name:c.name, meta:c.meta, country:c.country, lat:c.lat, lon:c.lon }]);
      if(error) throw error;
      c.status = 'confirmed';
    }catch(e){
      c.status = 'sync-error';
      showDebug('Erreur de sauvegarde Supabase : ' + e.message);
    }
    renderCities(id);
    updateCounter();
  }
  async function deleteCity(id){
    const c = cities.find(c=>c.id===id);
    const wasConfirmed = c && c.status === 'confirmed';
    cities = cities.filter(c=>c.id!==id);
    renderCities();
    updateCounter();
    closePopup();
    if(wasConfirmed){
      try{
        const { error } = await sb.from('visited_places').delete().eq('id', id);
        if(error) throw error;
      }catch(e){ showDebug('Erreur de suppression Supabase : ' + e.message); }
    }
  }

  function escapeHtml(str){
    return (str||'').replace(/[&<>"']/g, s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
  }


  // ---- zoom behaviour ----
  const zoom = d3.zoom()
    .scaleExtent([1,26])
    .extent([[0,0],[W,H]])
    .translateExtent([[0,0],[W,H]])
    .on('zoom', zoomed)
    .on('start', ()=>closePopup());
  svg.call(zoom);

  function zoomed(event){
    const t = event.transform;
    g.attr('transform', t);
    const k = t.k;
    g.selectAll('.inner-scale').attr('transform', `scale(${1/k})`);
    countryLabelAnchors.style('display', d => (k >= MIN_LABEL_K && d.area * k * k > LABEL_AREA_FACTOR) ? null : 'none');
    gCities.selectAll('.city-label').style('display', k >= CITY_LABEL_MIN_K ? null : 'none');
  }
  svg.call(zoom.transform, d3.zoomIdentity);

  document.getElementById('zoomIn').addEventListener('click', ()=> svg.transition().duration(300).call(zoom.scaleBy, 1.5));
  document.getElementById('zoomOut').addEventListener('click', ()=> svg.transition().duration(300).call(zoom.scaleBy, 1/1.5));
  document.getElementById('zoomReset').addEventListener('click', ()=> svg.transition().duration(400).call(zoom.transform, d3.zoomIdentity));

  bg.on('click', ()=> closePopup());

  function flyTo(x, y, targetK, onEnd){
    const t = d3.zoomIdentity.translate(W/2, H/2).scale(targetK).translate(-x, -y);
    const tr = svg.transition().duration(600).call(zoom.transform, t);
    if(onEnd) tr.on('end', onEnd);
  }

  // ---- cities state ----
  let cities = [];

  async function loadCities(){
    try{
      const { data, error } = await sb.from('visited_places').select('*').order('created_at');
      if(error) throw error;
      cities = (data||[]).map(r=>({ id:r.id, name:r.name, meta:r.meta, country:r.country, lat:r.lat, lon:r.lon, status:'confirmed' }));
    }catch(e){ showDebug('Chargement Supabase impossible : ' + e.message); }
    cities.forEach(c=>{
      const p = projection([c.lon, c.lat]);
      c.x = p[0]; c.y = p[1];
    });
    renderCities();
    updateCounter();
  }

  function updateCounter(){
    const confirmed = cities.filter(c=>c.status==='confirmed');
    const n = confirmed.length;
    const countrySet = new Set(confirmed.map(c=> c.country || c.meta || 'inconnu'));
    const m = countrySet.size;
    counterEl.innerHTML = `<b>${n}</b> ${n===1?'city':'cities'} visited · <b>${m}</b> ${m===1?'country':'countries'}`;
  }

  function markerClass(d){
    let c = 'place-marker';
    if(d.status==='draft' || d.status==='saving') c += ' draft';
    if(d.status==='sync-error') c += ' sync-error';
    return c;
  }

  function renderCities(justAddedId){
    const sel = gCities.selectAll('g.place-marker')
      .data(cities, d=>d.id)
      .join(
        enter => {
          const gEnter = enter.append('g').attr('class', markerClass)
            .attr('transform', d=>`translate(${d.x},${d.y})`)
            .on('click', (event,d)=>{ event.stopPropagation(); try{ openPopup(d); }catch(err){ showDebug(err); } });
          const inner = gEnter.append('g').attr('class','inner-scale');
          inner.append('circle').attr('class','city-dot-pulse').attr('r',3.6);
          inner.append('circle').attr('class','city-dot-outer').attr('r',6.5);
          inner.append('circle').attr('class','city-dot-inner').attr('r',2.3);
          inner.append('text').attr('class', d=> 'city-label' + (d.id===justAddedId ? ' is-new' : ''))
            .attr('x',7).attr('y',-6).text(d=>d.name);
          return gEnter;
        },
        update => {
          update.attr('class', markerClass);
          update.select('.city-label').attr('class', d=> 'city-label' + (d.id===justAddedId ? ' is-new' : ''));
          return update;
        },
        exit => exit.remove()
      );
    const t = d3.zoomTransform(svg.node());
    sel.select('.inner-scale').attr('transform', `scale(${1/t.k})`);
    sel.select('.city-label').style('display', t.k >= CITY_LABEL_MIN_K ? null : 'none');
    return sel;
  }

  // ---- recherche : OpenStreetMap (Nominatim) en priorité, base locale en secours ----
  const searchInput = document.getElementById('searchInput');
  const suggestionsEl = document.getElementById('suggestions');
  let searchTimer = null;
  let searchSeq = 0; // pour ignorer les réponses obsolètes si l'utilisateur retape vite

  function normalize(s){
    return (s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
  }

  function searchCitiesLocal(q){
    const nq = normalize(q);
    const starts = [], contains = [];
    for(const c of CITY_DB){
      const n = normalize(c[0]);
      if(n.startsWith(nq)) starts.push(c);
      else if(n.includes(nq)) contains.push(c);
    }
    starts.sort((a,b)=> (b[4]||0) - (a[4]||0));
    contains.sort((a,b)=> (b[4]||0) - (a[4]||0));
    // format uniforme [name, lat, lon, meta, country]
    return starts.concat(contains).slice(0,8).map(c=>[c[0], c[1], c[2], c[3], c[3]]);
  }

  async function searchCitiesRemote(q){
    const url = `https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=8&accept-language=fr&q=${encodeURIComponent(q)}`;
    const res = await fetch(url);
    if(!res.ok) throw new Error('recherche indisponible');
    const results = await res.json();
    return results.map(r=>{
      const name = r.name || r.display_name.split(',')[0];
      const meta = r.display_name.split(',').slice(1,3).join(',').trim();
      const country = (r.address && r.address.country) || r.display_name.split(',').slice(-1)[0].trim();
      return [name, parseFloat(r.lat), parseFloat(r.lon), meta, country];
    });
  }

  searchInput.addEventListener('input', ()=>{
    const q = searchInput.value.trim();
    clearTimeout(searchTimer);
    if(q.length < 2){ suggestionsEl.style.display = 'none'; return; }
    searchTimer = setTimeout(()=> runSearch(q), 350);
  });

  document.addEventListener('click', (e)=>{
    if(!e.target.closest('.search-wrap')) suggestionsEl.style.display = 'none';
  });

  async function runSearch(q){
    const mySeq = ++searchSeq;
    // affichage instantané des résultats locaux pendant que la recherche en ligne se fait
    renderSuggestions(searchCitiesLocal(q));
    try{
      const remote = await searchCitiesRemote(q);
      if(mySeq !== searchSeq) return; // une recherche plus récente a été lancée entretemps
      if(remote.length) renderSuggestions(remote);
    }catch(e){
      // pas de connexion / service indisponible : on garde les résultats locaux déjà affichés
    }
  }

  function renderSuggestions(results){
    suggestionsEl.style.display = 'block';
    if(!results.length){
      suggestionsEl.innerHTML = '<div class="suggestion empty">Aucun résultat</div>';
      return;
    }
    suggestionsEl.innerHTML = '';
    results.forEach(r=>{
      const [name, lat, lon, meta, country] = r;
      const div = document.createElement('div');
      div.className = 'suggestion';
      div.innerHTML = `<span class="s-name">${escapeHtml(name)}</span><span class="s-meta">${escapeHtml(meta)}</span>`;
      div.addEventListener('click', (ev)=>{ pickResult(name, lat, lon, meta, country); });
      suggestionsEl.appendChild(div);
    });
  }

  function pickResult(name, lat, lon, meta, country){
    try{
      const p = projection([lon, lat]);
      if(!p || isNaN(p[0]) || isNaN(p[1])) { showDebug('Coordonnées invalides pour ' + name); return; }

      const id = 'c_' + Date.now() + '_' + Math.random().toString(36).slice(2,7);
      const city = { id, name, meta, country, lat, lon, x:p[0], y:p[1], status:'draft' };
      cities.push(city);
      renderCities();

      searchInput.value = '';
      suggestionsEl.style.display = 'none';
      suggestionsEl.innerHTML = '';

      flyTo(p[0], p[1], 5, ()=>{
        try{ openPopup(city); }catch(err){ showDebug(err); }
      });
    }catch(err){ showDebug(err); }
  }

  window.addEventListener('keydown', (e)=>{ if(e.key === 'Escape') closePopup(); });

  loadCities();
})();
</script>
</body>
</html>
